<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
    <div>
        <h2>📅 Управление расписаниями</h2>
        <p style="color: var(--text-muted);">Выберите день для редактирования событий или добавьте новый день фестиваля.</p>
    </div>
    <button type="button" class="btn btn-secondary" onclick="openLlmImportModal('timetables')" style="height: 38px; display: inline-flex; align-items: center; gap: 6px;">
        <span>📥</span>
        <span>Сгенерировать из внешнего источника</span>
    </button>
</div>

{{ alerts_html }}

<div class="card" style="background: #eff6ff; border-color: #bfdbfe;">
    <h4 style="margin-bottom: 0.75rem; color: #1e40af;">+ Добавить новый день расписания</h4>
    <form method="POST" action="/timetables/add" style="display: flex; gap: 0.75rem; max-width: 600px; align-items: flex-end;" onsubmit="return validateDateForm(this);">
        <div style="flex: 1;">
            <label style="display:block; font-size:0.875rem; font-weight:600; margin-bottom:0.35rem;">Дата мероприятия</label>
            <input type="date" name="date" id="timetableDateInput" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="white-space: nowrap; height: 38px;">Добавить дату</button>
    </form>
</div>

<div class="card">
    <h3>Список дней фестиваля</h3>
    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {{ date_rows }}
        </tbody>
    </table>
</div>

<script>
function validateDateForm(form) {
    var dateInput = form.querySelector('input[name="date"]');
    if (!dateInput.value.trim()) {
        alert('Пожалуйста, выберите дату');
        dateInput.focus();
        return false;
    }
    return true;
}
</script>
