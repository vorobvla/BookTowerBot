<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация администратора — BookTower</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 0.5rem; color: #1e293b; text-align: center; }
        p.subtitle { margin-bottom: 1.5rem; color: #64748b; text-align: center; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.85rem; }
        input { width: 100%; box-sizing: border-box; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        input:focus { border-color: #4f46e5; outline: none; }
        button { width: 100%; padding: 0.75rem; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .alert { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #dcfce7; color: #166534; }
        .links-row { margin-top: 1.25rem; text-align: center; font-size: 0.875rem; color: #64748b; }
        .links-row a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .links-row a:hover { text-decoration: underline; }
        .info-note { margin-top: 1rem; font-size: 0.8rem; color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.65rem; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>📚 BookTower Admin</h2>
        <p class="subtitle">Регистрация нового администратора</p>
        {{ error_html }}
        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтверждение пароля</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="info-note">
            ℹ️ После регистрации учетная запись должна быть подтверждена администратором системы с помощью bash-скрипта.
        </div>
        <div class="links-row">
            Уже зарегистрированы? <a href="/login">Войти</a>
        </div>
    </div>
</body>
</html>
